ctivate'?'<label for="confirm">Ripeti password</label><input id="confirm" type="password" minlength="8" required autocomplete="new-password" placeholder="Ripeti la password">':remember)+'<button class="primary" type="submit">'+(state.mode==='login'?'Accedi':'Attiva account')+'</button></form>';const links=reset?'':('<button class="link" onclick="toggleMode()">'+(state.mode==='login'?'Prima attivazione':'Torna al login')+'</button>'+(state.mode==='login'?'<button class="link" onclick="requestReset()">Password dimenticata</button>':''));root.innerHTML='<main class="auth"><section class="auth-copy"><div class="brand"><img src="aerial-move-logo.png" alt="Logo Aerial Move"><b>AERIAL<i>MOVE</i></b></div><p class="eyebrow" style="color:#f6b9d2">ACCESSO PROTETTO</p><h1>La tua palestra, sempre con te.</h1><p>Calendario, allenamenti e scadenze per le atlete. Gestione completa per le istruttrici.</p></section><section class="auth-panel"><p class="eyebrow">BENVENUTA IN AERIAL MOVE</p><h2>'+title+'</h2><p class="muted">'+intro+'</p>'+roles+form+(message?'<p class="notice '+(isError?'error':'')+'">'+esc(message)+'</p>':'')+links+'<p class="fine">L’email dell’account non viene mostrata alle utenti.</p></section></main>'}
    function toggleMode(){state.mode=state.mode==='login'?'activate':'login';authView()}
    function requestedStartTab(){const requested=new URLSearchParams(location.search).get('open');return ['pilates','requests','guest-requests'].includes(requested)?requested:'home'}
    async function submitAuth(event){event.preventDefault();const password=document.getElementById('password').value;if(state.mode==='activate'){const confirm=document.getElementById('confirm').value;if(password!==confirm){authView('Le due password non coincidono.',true);return}try{await server('activate',{role:state.role,password});authView('Controlla la relativa casella email, conferma l’account e poi torna qui per accedere.')}catch(error){authView('Non è stato possibile attivare l’account. Se è già attivo, usa il login.',true)}return}const remember=document.getElementById('remember-device')?.checked!==false;try{const data=await server('login',{role:state.role,password,remember});state.token=data.token;if(remember){localStorage.setItem(STORAGE_KEY,state.token);sessionStorage.removeItem(STORAGE_KEY)}else{sessionStorage.setItem(STORAGE_KEY,state.token);localStorage.removeItem(STORAGE_KEY)}state.profile=data.profile;state.role=data.profile.role;state.tab=requestedStartTab();dashboard()}catch(error){authView('Password non corretta oppure account non ancora confermato.',true)}}

    async function sendInformationRequest(event){event.preventDefault();const code=normalizeMembershipCode(document.getElementById('request-code').value),messageText=document.getElementById('request-message').value.trim(),feedback=document.getElementById('request-feedback'),button=document.getElementById('request-send');if(!code||!messageText){feedback.innerHTML='<p class="notice error">Inserisci il codice tessera e la richiesta.</p>';return}button.disabled=true;button.textContent='Invio…';try{await server('request.create',{membershipCode:code,message:messageText});document.getElementById('request-message').value='';feedback.innerHTML='<p class="notice">Richiesta inviata alle istruttrici.</p>'}catch(error){feedback.innerHTML='<p class="notice error">'+esc(error.message||'Non è stato possibile inviare la richiesta.')+'</p>'}finally{button.disabled=false;button.textContent='Invia richiesta'}}

    async function bookGuestReformer(event){
      event.preventDefault();
