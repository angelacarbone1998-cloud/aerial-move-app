    const trainingDays=[
      {day:'Lunedì',title:'Spalle e apertura dorsale',image:'strength',kit:'Tappetino, elastic band, 2 yoga block e sedia',focus:[
        ['Piegamenti braccia con elastico','Tieni l’elastico dietro la schiena. Piega i gomiti mantenendoli paralleli al pavimento, esegui 10 movimenti e mantieni la piega 10 secondi.'],

        ['Allunghi da seduta','Da seduta con gambe piegate e una mano dietro, alza il bacino e porta l’altro braccio indietro. Ripeti 8 volte per lato e resta 10 secondi.'],

    function medicalStatus(value){if(!value)return '<span class="status neutral">Data non inserita</span>';const today=new Date();today.setHours(0,0,0,0);const expires=new Date(value+'T12:00:00');const days=Math.ceil((expires-today)/86400000);if(days<0)return '<span class="status danger">Scaduto da '+Math.abs(days)+' giorni</span>';if(days===0)return '<span class="status danger">Scade oggi</span>';if(days<=30)return '<span class="status warn">Scade tra '+days+' giorni</span>';return '<span class="status">Valido fino al '+fmt(value)+'</span>'}

    function renderExpiry(fieldName,title){document.getElementById('content').innerHTML='<section class="card"><div class="card-head"><div><p class="eyebrow">AGGIORNAMENTO MANUALE</p><h2>'+title+'</h2></div></div>'+(state.athletes.length?state.athletes.map((a)=>'<div class="attendance-row"><span><b>'+esc(a.full_name)+'</b><br><small class="muted">'+esc(a.activity)+'</small>'+(fieldName==='medical_certificate_expires_on'?'<br>'+medicalStatus(a[fieldName]):'')+'</span><input type="date" value="'+esc(a[fieldName]||'')+'" onchange="updateExpiry(\''+a.id+'\',\''+fieldName+'\',this.value)"></div>').join(''):'<div class="empty">Nessuna atleta inserita.</div>')+'<div id="expiry-message"></div></section>'}
    async function updateExpiry(id,fieldName,value){try{await server('athletes.expiry',{id,fieldName,value:value||null});document.getElementById('expiry-message').innerHTML='<p class="notice">Scadenza aggiornata.</p>'}catch{document.getElementById('expiry-message').innerHTML='<p class="notice error">Aggiornamento non riuscito.</p>'}}
    function renderAttendance(){const today=new Date().toISOString().slice(0,10);document.getElementById('content').innerHTML='<section class="card"><div class="card-head"><div><p class="eyebrow">AGGIORNAMENTO MANUALE</p><h2>Presenze</h2></div></div><div class="form-grid" style="margin-top:15px"><label class="field"><span>Data</span><input id="att-date" type="date" value="'+today+'"></label><label class="field"><span>Attività</span><input id="att-activity" value="Cerchio aereo N.A."></label></div><div style="margin-top:16px">'+(state.athletes.length?state.athletes.map((a)=>'<label class="attendance-row"><span><b>'+esc(a.full_name)+'</b><br><small class="muted">'+esc(a.activity)+'</small></span><input class="att-check" type="checkbox" data-id="'+a.id+'"></label>').join(''):'<div class="empty">Nessuna atleta inserita.</div>')+'</div>'+(state.athletes.length?'<button class="small-btn" onclick="saveAttendance()">Salva presenze</button>':'')+'<div id="attendance-message"></div></section>'}
    async function saveAttendance(){const classDate=document.getElementById('att-date').value;const activity=document.getElementById('att-activity').value.trim();if(!classDate||!activity)return;const rows=Array.from(document.querySelectorAll('.att-check')).map((el)=>({athlete_id:el.dataset.id,class_date:classDate,activity,present:el.checked}));try{await server('attendance.save',{rows});document.getElementById('attendance-message').innerHTML='<p class="notice">Presenze salvate.</p>'}catch{document.getElementById('attendance-message').innerHTML='<p class="notice error">Salvataggio non riuscito.</p>'}}
    restore();
  </script>
</body>
</html>
